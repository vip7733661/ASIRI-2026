<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotify Callback</title><style>body{font-family:-apple-system;background:#07110a;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}.box{padding:24px;border:1px solid #2d4635;border-radius:24px;background:#101812}strong{color:#1ed760}</style></head><body><div class="box"><strong id="title">جارٍ إكمال الربط…</strong><p id="message">يرجى الانتظار.</p></div><script type="module">const CLIENT_ID='3ac122f971744e508bfd33ad0637d421',NS='asiri-music-pro.v1.';const get=k=>{try{return JSON.parse(localStorage.getItem(NS+k)||'null')?.value??null}catch{return null}},set=(k,v)=>localStorage.setItem(NS+k,JSON.stringify({envelopeVersion:1,savedAt:Date.now(),value:v}));const code=new URLSearchParams(location.search).get('code'),error=new URLSearchParams(location.search).get('error'),verifier=get('spotify.codeVerifier'),redirectUri=new URL('callback.html',location.href).href;const title=document.querySelector('#title'),message=document.querySelector('#message');try{if(error)throw new Error(error);if(!code||!verifier)throw new Error('بيانات الربط غير مكتملة');const response=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:redirectUri,code_verifier:verifier})});if(!response.ok)throw new Error('تعذر استبدال رمز Spotify');const payload=await response.json();set('spotify.accessToken',payload.access_token);set('spotify.expiresAt',Date.now()+payload.expires_in*1000-60000);if(payload.refresh_token)set('spotify.refreshToken',payload.refresh_token);localStorage.removeItem(NS+'spotify.codeVerifier');title.textContent='تم الربط بنجاح ✓';message.textContent='ستعود إلى التطبيق الآن.';setTimeout(()=>location.replace('./'),700)}catch(e){title.textContent='تعذر إكمال الربط';message.textContent=e.message}</script></body></html>
